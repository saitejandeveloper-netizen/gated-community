<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Gated Community</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-box">
    <h2>Register</h2>
    <form id="registerForm">
        <input type="text" id="fullName" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="tel" id="phone" placeholder="Phone (10 digits)" required>
        <input type="password" id="password" placeholder="Password (min 8 chars)" required>
        <input type="text" id="flatNumber" placeholder="Flat Number">
        <button type="submit">Register</button>
    </form>
    <p id="message"></p>
    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
